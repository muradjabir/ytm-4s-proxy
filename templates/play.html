{% extends 'layout.html' if not request.headers.get('X-Requested-With') == 'XMLHttpRequest' else 'base_ajax.html' %}
{% block content %}
<div class="player-container">
    <div class="album-art-container">
        {% if thumbnail %}
        <img src="{{ proxy_image(thumbnail) }}" alt="Album Art" class="album-art">
        {% endif %}
    </div>
    
    <div class="now-playing-title">{{ song_title }}</div>
    <div class="now-playing-artist">{{ artist }}</div>
    
    <div class="play-download-status" id="play-download-status" style="margin: 14px auto; max-width: 280px; text-align: center;">
        <div id="play-status-text" style="font-size: 13px; color: #aaa; margin-bottom: 6px; font-weight: 500;">Connecting…</div>
        <div style="background: #222; border-radius: 3px; height: 5px; width: 100%; overflow: hidden; position: relative;">
            <div id="play-status-bar" style="background: #3b82f6; height: 100%; width: 0%; transition: width 0.25s linear;"></div>
        </div>
    </div>

    <div class="audio-container">
        <!-- Native audio player -->
        <audio controls autoplay id="audio-player">
            <source src="/stream/{{ video_id }}">
            Your browser does not support the audio element.
        </audio>
    </div>
</div>
{% endblock %}
