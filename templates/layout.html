<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f7f7f8">
    <meta name="apple-mobile-web-app-title" content="YT Music">
    <title>YouTube Music</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <a href="/" class="brand">
                <img src="{{ url_for('static', filename='favicon.svg') }}" width="18" height="18" class="brand-icon" alt="">
                <span class="brand-text">Music</span>
            </a>
        </div>
        <div class="nav-center">
            <form action="/search" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Search songs, artists…" required>
                <button type="submit" class="search-btn" aria-label="Search">
                    <img src="{{ url_for('static', filename='search.svg') }}" width="16" height="16" class="nav-icon" alt="">
                </button>
            </form>
        </div>
        <div class="nav-right">
            <a href="/library" class="nav-link-item">Library</a>
            <a href="/settings" class="nav-link-item nav-settings-btn" title="Settings" aria-label="Settings">
                <img src="{{ url_for('static', filename='settings.svg') }}" width="20" height="20" class="nav-icon" alt="Settings">
            </a>
        </div>
    </header>

    <main class="content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Persistent Player -->
    <div id="bottom-player" style="display: none;">
        <div class="player-progress">
            <div id="download-bar"></div>
            <div id="progress-bar"></div>
        </div>
        <div class="player-inner">
            <img id="player-thumb" src="" alt="Cover">
            <div class="player-info">
                <div id="player-title">Song Title</div>
                <div id="player-time">0:00</div>
            </div>
            <div class="player-controls">
                <button id="btn-play-pause" class="btn-play-pause" aria-label="Play or Pause">
                    <img id="play-pause-icon" src="{{ url_for('static', filename='play.svg') }}" width="24" height="24" class="player-icon" alt="">
                </button>
            </div>
        </div>
    </div>
    
    <audio id="global-audio"></audio>
    <script src="{{ url_for('static', filename='player.js') }}"></script>
</body>
</html>
