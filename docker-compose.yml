version: '3.8'

services:
  ytm-app:
    build: .
    container_name: ytm-app
    restart: unless-stopped
    volumes:
      # Mount cache directories so downloaded tracks and metadata persist
      - ./audio_cache:/app/audio_cache
      - ./image_cache:/app/image_cache
      - ./metadata_cache:/app/metadata_cache
      # Mount auth tokens and cookie files
      - ./cookies.txt:/app/cookies.txt
      - ./headers_auth.json:/app/headers_auth.json
      - ./oauth.json:/app/oauth.json
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ytm-net

  ytm-nginx:
    image: nginx:alpine
    container_name: ytm-nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ytm-app
    networks:
      - ytm-net

networks:
  ytm-net:
    driver: bridge
