<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YTM Proxy Cookie Sync</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #262626;
      padding-bottom: 12px;
    }
    .header svg {
      width: 24px;
      height: 24px;
      fill: #ff0000;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .subtitle {
      font-size: 11px;
      color: #888;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #cc0000;
    }
    .btn:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #222;
    }
    .toggle-label {
      font-size: 12px;
      color: #ccc;
    }
    .status-box {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      display: none;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      display: block;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
      display: block;
    }
    .status-info {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      display: block;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    <div>
      <div class="title">YTM Cookie Sync</div>
      <div class="subtitle">Sync Mac browser to Ubuntu proxy</div>
    </div>
  </div>

  <div class="field">
    <label for="server-url">Proxy Server URL</label>
    <input type="text" id="server-url" value="http://192.168.2.2:5000" placeholder="http://192.168.2.2:5000">
  </div>

  <button id="btn-sync" class="btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    Sync YouTube Cookies Now
  </button>

  <div class="toggle-row">
    <span class="toggle-label">Auto-sync on YouTube visit</span>
    <input type="checkbox" id="auto-sync" checked>
  </div>

  <div id="status-box" class="status-box"></div>

  <div class="footer">
    Extracts active YouTube cookies for yt-dlp playback.
  </div>

  <script src="popup.js"></script>
</body>
</html>
